# Cutting a release is `git tag v29.0.0 && git push --tags`. ci.yml gates it (the xunit suite),
# then the GitHub Release is created with docs/RELEASE-<version>.md as its body when that file
# exists, generated notes otherwise.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v29.0.0)"
        required: true

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # ci.yml restores from rewaffle's feeds with REWAFFLE_TOKEN; a called workflow sees no secrets
    # unless they are passed down.
    secrets: inherit

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pick the notes
        id: notes
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          notes="docs/RELEASE-${tag#v}.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -f "$notes" ]; then echo "file=$notes" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}
