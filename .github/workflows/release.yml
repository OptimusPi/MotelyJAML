name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v24.5.0)"
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release

  server:
    needs: test
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            exe: Motely.Lsp.exe
          - rid: osx-arm64
            os: macos-latest
            exe: Motely.Lsp
          - rid: linux-x64
            os: ubuntu-latest
            exe: Motely.Lsp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish the language server
        run: >
          dotnet publish Motely.Lsp -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true -o out

      - name: Prove it over stdio
        run: node Motely.Lsp/smoke-lsp.mjs
        env:
          MOTELY_LSP_SERVER: out/${{ matrix.exe }}

      - name: Package
        shell: bash
        run: |
          cd out
          tar -czf ../jaml-lsp-${{ matrix.rid }}.tar.gz ${{ matrix.exe }}

      - uses: actions/upload-artifact@v4
        with:
          name: jaml-lsp-${{ matrix.rid }}
          path: jaml-lsp-${{ matrix.rid }}.tar.gz

  release:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jaml-lsp-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: jaml-lsp-*.tar.gz
