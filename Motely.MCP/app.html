<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motely search</title>
<style>
  :root { --bg: #fbfaf7; --fg: #1d1c1a; --dim: #6d6a64; --line: #e3e0d9; --accent: #c2410c; --good: #15803d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a18; --fg: #ecebe7; --dim: #9c9890; --line: #34322e; --accent: #fb923c; --good: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; }
  .state { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .state.running { color: var(--accent); border-color: var(--accent); }
  .state.finished { color: var(--good); border-color: var(--good); }
  .sub { color: var(--dim); font-size: 12px; margin: 2px 0 10px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0 12px; font-variant-numeric: tabular-nums; }
  .stats b { display: block; font-size: 16px; }
  .stats span { color: var(--dim); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.seed { font-family: ui-monospace, monospace; letter-spacing: .5px; }
  .wrap { overflow-x: auto; }
  button { font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line);
           background: transparent; color: var(--fg); cursor: pointer; margin-left: auto; }
  button:disabled { opacity: .4; cursor: default; }
  .empty { color: var(--dim); padding: 12px 0; }
</style>
</head>
<body>
<header>
  <h1 id="name">Motely</h1>
  <span id="state" class="state">waiting</span>
  <button id="stop" disabled>Stop</button>
</header>
<div id="sub" class="sub">Waiting for a search…</div>
<div class="bar"><div id="bar"></div></div>
<div class="stats">
  <div><b id="searched">0</b><span>searched</span></div>
  <div><b id="matched">0</b><span>matched</span></div>
  <div><b id="speed">0</b><span>seeds/s</span></div>
  <div><b id="pct">0%</b><span>done</span></div>
</div>
<div class="wrap"><table id="table"><thead></thead><tbody></tbody></table></div>
<script>
  // MCP Apps (io.modelcontextprotocol/ui): JSON-RPC over postMessage with the host.
  let nextId = 1, searchId = null, timer = null;
  const pending = new Map();
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Math.round(n).toLocaleString();

  function request(method, params) {
    const id = nextId++;
    window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
  }

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id)) {
      const p = pending.get(msg.id); pending.delete(msg.id);
      msg.error ? p.reject(msg.error) : p.resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-result") show(msg.params?.structuredContent);
    if (msg.method === "ui/resource-teardown") {
      clearInterval(timer);
      window.parent.postMessage({ jsonrpc: "2.0", id: msg.id, result: {} }, "*");
    }
  });

  function show(s) {
    if (!s || !s.id) return;
    searchId = s.id;
    $("name").textContent = s.name;
    $("state").textContent = s.state;
    $("state").className = "state " + (s.state === "running" ? "running" : s.state === "finished" ? "finished" : "");
    $("sub").textContent = `${s.id} · ${s.deck} ${s.stake} · ${s.mode}` + (s.resumeBatch != null ? ` · resume at batch ${s.resumeBatch}` : "");
    $("bar").style.width = Math.min(100, s.percent) + "%";
    $("searched").textContent = fmt(s.seedsSearched);
    $("matched").textContent = fmt(s.matching);
    $("speed").textContent = fmt(s.seedsPerSecond);
    $("pct").textContent = s.percent.toFixed(2) + "%";
    $("stop").disabled = s.state !== "running";

    const labels = s.tallyLabels || [];
    $("table").tHead.innerHTML = "<tr><th>#</th><th>Seed</th><th>Score</th>" + labels.map((l) => `<th>${esc(l)}</th>`).join("") + "</tr>";
    $("table").tBodies[0].innerHTML = s.top.length
      ? s.top.map((r, i) => `<tr><td>${i + 1}</td><td class="seed">${esc(r.seed)}</td><td>${r.score}</td>` + r.tallies.map((t) => `<td>${t}</td>`).join("") + "</tr>").join("")
      : `<tr><td colspan="${3 + labels.length}" class="empty">No seeds yet.</td></tr>`;

    notify("ui/notifications/size-changed", { width: document.body.scrollWidth, height: document.body.scrollHeight });
    clearInterval(timer);
    if (s.state === "running") timer = setInterval(poll, 1500);
  }

  async function poll() {
    if (!searchId) return;
    try {
      const result = await request("tools/call", { name: "motely_status", arguments: { id: searchId, top: 20 } });
      show(result?.structuredContent);
    } catch { clearInterval(timer); }
  }

  $("stop").addEventListener("click", async () => {
    $("stop").disabled = true;
    const result = await request("tools/call", { name: "motely_stop", arguments: { id: searchId } });
    show(result?.structuredContent);
  });

  function esc(text) {
    return String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  }

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    clientInfo: { name: "motely-search-view", version: "1.0.0" },
    appCapabilities: {},
  }).then(() => notify("ui/notifications/initialized", {}));
</script>
</body>
</html>
